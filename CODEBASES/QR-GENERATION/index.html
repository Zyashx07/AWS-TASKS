<!DOCTYPE html>
<html>

<head>

    <title>QR Code Generator</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>QR Code Generator</h1>

        <input
            type="text"
            id="textInput"
            placeholder="Enter text or URL"
        >

        <button onclick="generateQR()">
            Generate QR
        </button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
